models:
  - name: stg_order_items
    description: Individual items that make up customer orders, one row per item.

    columns:
      - name: order_id
        description: The order that the item belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: order_item_id
        description: The sequential item number within an order.
        data_tests:
          - not_null

      - name: product_id
        description: The product associated with the order item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: seller_id
        description: The seller responsible for the order item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

      - name: shipping_limit_date
        description: The date by which the seller should ship the order item.
        data_tests:
          - not_null

      - name: price
        description: Price of the product in the order item.
        data_tests:
          - not_null

      - name: freight_value
        description: Freight cost associated with the order item.
        data_tests:
          - not_null