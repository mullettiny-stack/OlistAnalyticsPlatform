models:
  - name: stg_customers
    description: Customer data with basic cleaning and transformation applied, one row per customer.
    columns:
      - name: customer_id
        description: The unique key for each customer.
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: The unique identifier for the customer across orders. 
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: The prefix for the customers' zipcode
        data_tests: 
          - not_null 

      - name: customer_city
        description: Customer city of residence 
        data_tests: 
          - not_null

      - name: customer_state
        description: Customer state of residence 
        data_tests:
          - not_null