models:
  - name: stg_sellers
    description: Seller information from the Olist e-commerce dataset.

    columns:
      - name: seller_id
        description: Unique identifier for the seller.
        data_tests:
          - not_null
          - unique

      - name: seller_zip_code_prefix
        description: The ZIP code prefix associated with the seller.
        data_tests:
          - not_null

      - name: seller_city
        description: City where the seller is located.
        data_tests:
          - not_null

      - name: seller_state
        description: Brazilian state where the seller is located.
        data_tests:
          - not_null