version: 2

models:
  - name: int_order_products
    description: Order items enriched with product information, one row per order item.

    columns:
      - name: order_id
        description: The order associated with the item.
        data_tests:
          - not_null

      - name: order_item_id
        description: The item number within the order.
        data_tests:
          - not_null

      - name: product_id
        description: The product associated with the order item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: product_category_name
        description: The category of the product.

      - name: price
        description: The price of the product.
        data_tests:
          - not_null

      - name: freight_value
        description: The freight cost associated with the order item.
        data_tests:
          - not_null