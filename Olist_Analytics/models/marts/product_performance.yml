version: 2

models:
  - name: product_performance
    description: Product performance showing order count, sales, and freight value.

    columns:
      - name: product_id
        description: Unique identifier for the product.
        data_tests:
          - not_null
          - unique

      - name: product_category_name
        description: The category of the product.

      - name: product_category_name_translation
        description: The translation of the spanish product name 

      - name: order_count
        description: Number of distinct orders containing the product.
        data_tests:
          - not_null

      - name: total_sales
        description: Total sales value generated by the product.
        data_tests:
          - not_null

      - name: total_freight
        description: Total freight value associated with the product.
        data_tests:
          - not_null